# ──────────────────────────────────────────────────────────────────────
# nginx.conf — Reverse proxy for SEC Semantic Search
#
# Routes:
#   /api/admin/* → frontend:3000 (Next.js admin route handlers; they hold
#                  the admin key server-side and forward to FastAPI)
#   /api/*  → api:8000   (FastAPI REST endpoints)
#   /ws/*   → api:8000   (WebSocket connections, with upgrade)
#   /*      → frontend:3000 (Next.js application)
#
# TLS: To enable HTTPS, uncomment the TLS server block below and mount
# certificates via docker-compose volumes.  The HTTP block will then
# redirect all traffic to HTTPS. Scenarios B and C are insecure without
# TLS because API keys, EDGAR credentials, and search traffic would
# otherwise travel over plaintext HTTP.
# ──────────────────────────────────────────────────────────────────────

# Static CSP for API and WebSocket responses (FastAPI sends the same one).
map $uri $api_csp {
    ~^/(api|ws)/  "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' ws: wss:;";
    default       "";
}

upstream api_backend {
    server api:8000;
}

upstream frontend_app {
    server frontend:3000;
}

# ── HTTP server ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Suppress nginx version in Server header (security hardening).
    server_tokens off;

    # Request body size limit — defence against memory exhaustion via
    # oversized POST bodies.  The API's own payload sizes are small (JSON);
    # 1 MB is generous for any legitimate request.
    client_max_body_size 1m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy: API and WebSocket responses only (the map
    # above). Pages get a per-request nonce policy from Next.js
    # (frontend/src/proxy.ts); a static policy here would block the inline
    # scripts Next.js needs to hydrate, and a second policy can only narrow
    # the first. nginx omits a header whose value is empty.
    add_header Content-Security-Policy $api_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # ── Admin routes (Next.js route handlers, not FastAPI) ──────────
    # Longer prefix than /api/, so it wins. The handlers validate the
    # admin session cookie and add X-Admin-Key when forwarding (AD#32);
    # FastAPI has no /api/admin/* routes.
    location /api/admin/ {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API routes ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — ingest can be long-running
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── WebSocket routes ─────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket idle timeout (10 minutes; heartbeats keep it alive)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Static assets (immutable, content-hashed by Next.js) ────────
    location /_next/static/ {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Frontend (everything else) ───────────────────────────────────
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

