# ──────────────────────────────────────────────────────────────────────
# deploy.yml — Automated Cloud Run deployment for SEC Semantic Search
#
# Two triggers:
#
#   1. `workflow_dispatch`  — manual deploy from the Actions tab.
#        Input: environment (defaults to `production`).
#
#   2. `push` of a `v*` tag  — tagged releases deploy automatically
#        (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
#
# Google credentials are issued only to this workflow running at a v* tag
# without '/' in its name: the Workload Identity provider created by
# scripts/gcloud-setup-deployer.sh rejects every other workflow file and
# ref. Renaming this file breaks Google authentication. Run a manual deploy against a
# tag ("Use workflow from" → Tags); dispatched from a branch it fails at
# the first Google authentication step.
#
# Nothing skips the CI gate. Who may deploy is set in GitHub, not here:
# scripts/github-protect-deploy.sh restricts creating, moving and deleting
# every tag starting with v to repository admins, and makes the `production` environment
# accept v* tags only and wait for a required reviewer.
#
# The workflow:
#   1. Waits for the CI workflow to succeed on the same SHA.
#   2. Authenticates to GCP via Workload Identity Federation — no
#      long-lived JSON service account keys live in GitHub secrets.
#   3. Builds both container images via `gcloud builds submit`, which
#      runs on Google infrastructure close to Artifact Registry (much
#      faster than building 6+ GB CUDA images on a GitHub runner).
#   4. Reuses `scripts/gcloud-deploy.sh deploy` to apply the Knative
#      YAML manifests — single source of truth for placeholder
#      substitution.
#
# Permissions are granted per job. Only the three jobs that authenticate
# to Google hold `id-token: write`; any code running in a job with it can
# mint a GitHub OIDC token for this repository.
#
# Required repository secrets:
#   - GCP_WORKLOAD_IDENTITY_PROVIDER
#       projects/NUMBER/locations/global/workloadIdentityPools/POOL/
#       providers/PROVIDER
#   - GCP_SERVICE_ACCOUNT
#       sec-search-deployer@PROJECT_ID.iam.gserviceaccount.com
#       Both are created by scripts/gcloud-setup-deployer.sh, which also
#       grants the deployer its roles (no Secret Manager role, no
#       project-wide storage role).
#   - GCP_PROJECT_ID
#   - GCP_REGION (e.g. us-central1)
#
# Required Secret Manager secret (created by scripts/gcloud-setup-secrets.sh):
#   - sec-search-hf-token — Hugging Face read token with access to the gated
#       embedding model. Read by Cloud Build only, to bake the weights into
#       the API image; the Cloud Run service never sees it.
#
# Setup guide: see docs/DEPLOYMENT.md §6.
# ──────────────────────────────────────────────────────────────────────

name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
  push:
    tags:
      - "v*"

concurrency:
  # Serialise deploys — never let two deployments race for the same
  # Cloud Run revision (and the in-memory task state on max-instances=1).
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Workflow default: read the repository, nothing else. Jobs that need
# more declare it themselves.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Gate: block deploy until CI has succeeded on the same commit.
  #
  # Polls the Checks API with the runner's preinstalled gh CLI rather than
  # a third-party action: a composite action can fetch its own
  # dependencies by mutable tag at run time, which a SHA pin does not
  # freeze. Only check runs created by the GitHub Actions app (id 15368)
  # count, so another installed app cannot satisfy the gate with a check
  # of the same name.
  # ────────────────────────────────────────────────────────────────────
  await-ci:
    name: Await CI success
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for CI checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          checks=(
            "Backend tests (Python 3.12)"
            "Frontend tests (Node 22)"
            "Ruff lint & format check"
          )
          while true; do
            pending=0
            for name in "${checks[@]}"; do
              # filter=latest: a re-run replaces the earlier result.
              state=$(gh api --method GET "repos/${REPO}/commits/${SHA}/check-runs" \
                -f check_name="$name" -f filter=latest -f app_id=15368 \
                --jq '.check_runs[0] | if . == null then "missing" else "\(.status) \(.conclusion)" end')
              case "$state" in
                "completed success") ;;
                completed*)
                  echo "::error::${name} concluded '${state#completed }' on ${SHA}"
                  exit 1
                  ;;
                *)
                  pending=1
                  echo "Waiting for ${name} (${state})"
                  ;;
              esac
            done
            if [ "$pending" -eq 0 ]; then
              break
            fi
            sleep 20
          done
          echo "All CI checks passed on ${SHA}."

  # ────────────────────────────────────────────────────────────────────
  # Build: push API (CUDA) + frontend images to Artifact Registry.
  # ────────────────────────────────────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [await-ci]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation token exchange

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      REPO_NAME: sec-search
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
      # Both builds run as this account, the only one that can read the
      # Hugging Face token (gcloud-setup-secrets.sh). A build with a
      # user-specified account must name its logging mode; with
      # CLOUD_LOGGING_ONLY `gcloud builds submit` waits for the build and
      # fails with it, and prints the log URL instead of streaming.
      BUILD_SERVICE_ACCOUNT_NAME: sec-search-build

    outputs:
      api_image: ${{ steps.image-tags.outputs.api_image }}
      frontend_image: ${{ steps.image-tags.outputs.frontend_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Resolve image tags
        id: image-tags
        run: |
          # Derive a short SHA-based tag plus the conventional `latest`
          # tag so the Knative YAML (which references `:latest`) picks up
          # the new image. The short SHA tag is useful for rollbacks.
          short_sha="${GITHUB_SHA:0:7}"
          api_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/api"
          fe_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/frontend"
          {
            echo "api_image=${api_base}:latest"
            echo "api_image_sha=${api_base}:${short_sha}"
            echo "api_build_cache=${api_base}-build-cache:latest"
            echo "frontend_image=${fe_base}:latest"
            echo "frontend_image_sha=${fe_base}:${short_sha}"
          } >> "$GITHUB_OUTPUT"

      # Cloud Build runs on Google infrastructure — building the ~6 GB
      # CUDA image on a GitHub runner would consume significant minutes
      # and egress. Cloud Build is also already part of the deployment's
      # trusted boundary (same project, same IAM).
      #
      # We write an inline cloudbuild.yaml because `--tag` alone does
      # not support `--build-arg` (needed for TORCH_INDEX_URL). The
      # heredoc uses 'EOF' (quoted) so no shell expansion happens inside
      # the file — all substitutions are Cloud Build's own `$_VAR`.
      #
      # The Hugging Face token reaches `docker build` as a BuildKit
      # secret read from the step's environment (`env=HF_TOKEN`); it is
      # never expanded into the command line, a build arg or a layer.
      # Only the build account (sec-search-build) can read the secret.
      # REQUIRE_BAKED_MODEL=1 fails the build if the secret is missing,
      # because the Cloud Run manifest runs with HF_HUB_OFFLINE=1.
      #
      # Layer cache: each Cloud Build worker starts empty, and an
      # image's inline cache only describes its final stage — but the CUDA
      # wheel, the dependencies and the model are all in the `builder`
      # stage. So the builder target is built and pushed first as
      # `api-build-cache`, and both builds read it back with --cache-from.
      # A deploy that changes only `src/` rebuilds the project wheel and the
      # runtime layer that installs it; the first deploy just warns that
      # the cache images do not exist yet.
      - name: Build API image (CUDA) via Cloud Build
        env:
          API_IMAGE: ${{ steps.image-tags.outputs.api_image }}
          API_BUILD_CACHE: ${{ steps.image-tags.outputs.api_build_cache }}
        run: |
          cat > /tmp/cloudbuild-api.yaml <<'EOF'
          steps:
            - name: gcr.io/cloud-builders/docker
              entrypoint: bash
              env:
                - DOCKER_BUILDKIT=1
              secretEnv:
                - HF_TOKEN
              args:
                - -c
                - >-
                  docker build -f Dockerfile.api --target builder
                  --cache-from ${_BUILD_CACHE}
                  --build-arg BUILDKIT_INLINE_CACHE=1
                  --build-arg TORCH_INDEX_URL=${_TORCH_INDEX_URL}
                  --build-arg REQUIRE_BAKED_MODEL=1
                  --secret id=hf_token,env=HF_TOKEN
                  -t ${_BUILD_CACHE} .
                  && docker build -f Dockerfile.api
                  --cache-from ${_BUILD_CACHE}
                  --cache-from ${_IMAGE}
                  --build-arg BUILDKIT_INLINE_CACHE=1
                  --build-arg TORCH_INDEX_URL=${_TORCH_INDEX_URL}
                  --build-arg REQUIRE_BAKED_MODEL=1
                  --secret id=hf_token,env=HF_TOKEN
                  -t ${_IMAGE} .
          availableSecrets:
            secretManager:
              - versionName: projects/${PROJECT_ID}/secrets/sec-search-hf-token/versions/latest
                env: HF_TOKEN
          images:
            - ${_IMAGE}
            - ${_BUILD_CACHE}
          options:
            machineType: E2_HIGHCPU_8
            logging: CLOUD_LOGGING_ONLY
          timeout: 3600s
          EOF
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --service-account="projects/${PROJECT_ID}/serviceAccounts/${BUILD_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --config=/tmp/cloudbuild-api.yaml \
            --substitutions=_IMAGE="${API_IMAGE}",_BUILD_CACHE="${API_BUILD_CACHE}",_TORCH_INDEX_URL="${TORCH_INDEX_URL}" \
            .

      - name: Tag API image with commit SHA
        env:
          API_IMAGE: ${{ steps.image-tags.outputs.api_image }}
          API_IMAGE_SHA: ${{ steps.image-tags.outputs.api_image_sha }}
        run: |
          gcloud artifacts docker tags add \
            "${API_IMAGE}" \
            "${API_IMAGE_SHA}" \
            --quiet

      - name: Build frontend image via Cloud Build
        env:
          FRONTEND_IMAGE: ${{ steps.image-tags.outputs.frontend_image }}
        run: |
          cat > /tmp/cloudbuild-frontend.yaml <<'EOF'
          steps:
            - name: gcr.io/cloud-builders/docker
              args:
                - build
                - -f
                - Dockerfile.frontend
                - -t
                - ${_IMAGE}
                - .
          images:
            - ${_IMAGE}
          options:
            logging: CLOUD_LOGGING_ONLY
          timeout: 1800s
          EOF
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --service-account="projects/${PROJECT_ID}/serviceAccounts/${BUILD_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --config=/tmp/cloudbuild-frontend.yaml \
            --substitutions=_IMAGE="${FRONTEND_IMAGE}" \
            .

      - name: Tag frontend image with commit SHA
        env:
          FRONTEND_IMAGE: ${{ steps.image-tags.outputs.frontend_image }}
          FRONTEND_IMAGE_SHA: ${{ steps.image-tags.outputs.frontend_image_sha }}
        run: |
          gcloud artifacts docker tags add \
            "${FRONTEND_IMAGE}" \
            "${FRONTEND_IMAGE_SHA}" \
            --quiet

  # ────────────────────────────────────────────────────────────────────
  # Deploy: apply Knative manifests via scripts/gcloud-deploy.sh.
  # ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: ${{ inputs.environment || 'production' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation token exchange

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # Reuse the existing deployment script. It already handles sed
      # placeholder substitution and CORS/URL wiring between services.
      - name: Deploy services
        run: ./scripts/gcloud-deploy.sh deploy

      - name: Show deployment status
        run: ./scripts/gcloud-deploy.sh status

  # ────────────────────────────────────────────────────────────────────
  # Smoke test: hit /api/health on the freshly deployed API.
  # ────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation token exchange

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Resolve API URL
        id: api-url
        run: |
          url=$(gcloud run services describe sec-search-api \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')
          if [ -z "$url" ]; then
            echo "Failed to resolve API URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          API_URL: ${{ steps.api-url.outputs.url }}
        run: |
          # /api/health is the unauthenticated liveness probe — no API
          # key required. Give the revision up to 60s to go ready.
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "${API_URL}/api/health"; then
              echo ""
              echo "Smoke test passed on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 6 attempts." >&2
          exit 1
